name: Publicar hinário
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/list-search.test.mjs
      - run: node tests/music.test.mjs
      - run: node tests/music-player.test.mjs
      - run: node tests/music-synth.test.mjs
      - run: python tests/introduction.test.py
      - run: node tests/updates.test.mjs
      - run: python tests/cache.test.py
      - run: python tests/seo.test.py
      - run: pip install -r requirements.txt
      - run: python tests/fermatas.test.py
      - run: python tests/import-sync.test.py
      - run: python tests/repeats.test.py
      - uses: actions/configure-pages@v5
        id: pages
      - run: python build.py
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - run: python scripts/check_links.py
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
